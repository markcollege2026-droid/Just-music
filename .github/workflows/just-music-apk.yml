name: Just Music APK

# Builds the music-only edition: a debug APK and a signed release APK, both
# universal (all ABIs). Manual only, so it never competes with the regular CI.
on:
  # GitHub only runs push-triggered workflows from the branch carrying the file,
  # so this branch is its own build trigger.
  push:
    branches: [ arena/f605d077-just-music ]
  workflow_dispatch:
    inputs:
      variant:
        description: "Which APKs to build"
        type: choice
        default: both
        options:
          - both
          - debug
          - release

concurrency:
  group: just-music-apk
  cancel-in-progress: true

permissions:
  contents: read

env:
  # A build-only signing key, generated on the runner for this job. The music
  # edition ships with its own applicationId, so it never has to match the
  # Play/IzzyOnDroid signature of io.github.aedev.flow.
  STORE_PASSWORD: justmusic-build
  KEY_ALIAS: justmusic
  KEY_PASSWORD: justmusic-build
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  apk:
    name: Build APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create signing keystore
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname "CN=Just Music, OU=Just Music, O=Just Music, L=Tel Aviv, C=IL"
          ls -l release.keystore

      - name: Build debug APK
        if: ${{ github.event_name == 'push' || inputs.variant == 'both' || inputs.variant == 'debug' }}
        run: ./gradlew :app:assembleFossDebug --stacktrace

      - name: Build release APK
        if: ${{ github.event_name == 'push' || inputs.variant == 'both' || inputs.variant == 'release' }}
        run: ./gradlew :app:assembleFossRelease --stacktrace

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for f in app/build/outputs/apk/foss/debug/*universal*.apk app/build/outputs/apk/foss/release/*universal*.apk; do
            cp "$f" dist/
          done
          ls -l dist
          test -n "$(ls -A dist)"

      - name: Verify signing
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          for apk in dist/*.apk; do
            echo "== $apk"
            "$apksigner" verify --print-certs "$apk" | head -12
          done

      - name: Checksums
        run: cd dist && sha256sum *.apk | tee checksums.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: just-music-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
