name: Just Music APK delivery

# The APKs live in Actions artifacts, which are served from Azure blob storage. This job copies the
# newest successful build into a lightweight git tag (`just-music-apks`) so the binaries can be
# fetched over plain git, and so there is a stable, browsable place that always holds the last pair.
on:
  push:
    branches: [ arena/f605d077-just-music ]
    paths:
      - '.github/workflows/just-music-deliver.yml'
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run whose just-music-apks artifact to publish (empty: latest successful)"
        required: false
        type: string

permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  publish:
    name: Publish APKs as a git tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Find the build run
        id: find
        run: |
          set -euo pipefail
          run_id="${{ inputs.run_id }}"
          if [ -z "$run_id" ]; then
            run_id=$(gh api "repos/$GH_REPO/actions/workflows/just-music-apk.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')
          fi
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Publishing APKs from run $run_id"

      - name: Download APK artifact
        run: |
          set -euo pipefail
          rm -rf dist
          gh run download "${{ steps.find.outputs.run_id }}" --name just-music-apks --dir dist
          ls -l dist

      - name: Publish as the just-music-apks tag
        run: |
          set -euo pipefail
          # A scratch repository, so the checkout (and this branch's history) never sees a binary.
          rm -rf /tmp/pub && mkdir -p /tmp/pub/apk && cd /tmp/pub
          cp dist/*.apk dist/checksums.txt apk/   # dist/ was downloaded into the workspace root
          ls -l apk/
          cat > apk/README.md <<'EOF'
          # Just Music APKs

          | File | What it is |
          |---|---|
          | `app-foss-universal-debug.apk` | debug build, debug-signed, `io.github.aedev.justmusic.debug` |
          | `app-foss-universal-release.apk` | R8 release build, signed with the CI build key, `io.github.aedev.justmusic` |
          | `checksums.txt` | SHA-256 of both APKs |

          Fetch with `git fetch origin refs/tags/just-music-apks:refs/tags/just-music-apks`, or open
          `apk/` on the tag in GitHub. The tag is replaced on every publish; old APKs are not kept.
          EOF
          git init -q
          git add .
          git -c user.name="just-music-bot" -c user.email="actions@users.noreply.github.com" \
            commit -q -m "apk: Just Music APKs from run ${{ steps.find.outputs.run_id }} [apk-artifacts]"
          git tag just-music-apks
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" \
            refs/tags/just-music-apks
          echo "Published tag just-music-apks -> $(git rev-parse HEAD)"
